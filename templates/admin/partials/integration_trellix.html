<div id="settings-tab-trellix-ex-nx" class="settings-tab-pane">
    <div class="bg-tertiary rounded-xl border border-white/10 p-6 max-w-3xl">
        <h3 class="text-lg font-semibold accent-blue mb-2">Trellix EX / CMS / NX</h3>
        <p class="text-secondary text-sm mb-4">Push approved YARA to Trellix Email (EX), CMS, or Network (NX). Custom HTTP YARA targets: <strong class="text-primary">HTTP YARA push</strong> tab.</p>
        <div class="flex flex-wrap gap-1.5 p-1 rounded-xl bg-black/30 border border-white/10 w-fit max-w-full mb-2">
            <button type="button" class="trellix-exnx-subtab-btn px-3 py-2 rounded-lg text-sm font-medium transition bg-cyan-600 text-white" data-trellix-exnx-sub="ex">Email (EX)</button>
            <button type="button" class="trellix-exnx-subtab-btn px-3 py-2 rounded-lg text-sm font-medium transition bg-tertiary text-primary hover:bg-white/10" data-trellix-exnx-sub="cms">CMS</button>
            <button type="button" class="trellix-exnx-subtab-btn px-3 py-2 rounded-lg text-sm font-medium transition bg-tertiary text-primary hover:bg-white/10" data-trellix-exnx-sub="nx">Network (NX)</button>
        </div>
        <div id="trellix-exnx-sub-ex" class="trellix-exnx-subpane space-y-3">
            <form id="trellixExForm" class="space-y-4 max-w-3xl">
                <div>
                    <label for="trellix_ex_enabled" class="block text-sm font-semibold text-secondary mb-1">Enable Trellix EX YARA push on approve</label>
                    <select id="trellix_ex_enabled" name="trellix_ex_enabled" class="w-full max-w-xs px-3 py-2 rounded-lg bg-tertiary border border-white/10 text-primary focus:border-accent-green">
                        <option value="false" {% if settings.trellix_ex_enabled == 'false' %}selected{% endif %}>No</option>
                        <option value="true" {% if settings.trellix_ex_enabled == 'true' %}selected{% endif %}>Yes</option>
                    </select>
                </div>
                <div id="trellixExTargetsList" class="space-y-3" data-initial="{{ settings.trellix_ex_targets | e }}"></div>
                <button type="button" id="trellixExAddTarget" class="px-3 py-1.5 rounded-lg text-sm font-medium bg-cyan-600 hover:bg-cyan-500 text-white transition">+ Add EX target</button>
                <div class="flex flex-wrap gap-2">
                    <button type="submit" class="px-4 py-2 rounded-lg font-semibold bg-cyan-600 hover:bg-cyan-500 text-white transition">Save Trellix EX settings</button>
                    <button type="button" id="trellixExTestBtn" class="px-4 py-2 rounded-lg font-semibold bg-tertiary border border-cyan-500/40 text-cyan-200 transition">Test login + upload + cleanup</button>
                </div>
            </form>
            <div id="trellixExMessage" class="hidden text-sm"></div>
            <div id="trellixExTestResult" class="hidden rounded-lg border border-white/10 bg-black/30 p-3 text-sm mt-3"></div>
        </div>
        <div id="trellix-exnx-sub-cms" class="trellix-exnx-subpane hidden space-y-3 pt-4 border-t border-white/10">
            <form id="trellixCmsForm" class="space-y-4 max-w-3xl">
                <div>
                    <label for="trellix_cms_enabled" class="block text-sm font-semibold text-secondary mb-1">Enable Trellix CMS YARA push</label>
                    <select id="trellix_cms_enabled" class="w-full max-w-xs px-3 py-2 rounded-lg bg-tertiary border border-white/10 text-primary">
                        <option value="false" {% if settings.trellix_cms_enabled == 'false' %}selected{% endif %}>No</option>
                        <option value="true" {% if settings.trellix_cms_enabled == 'true' %}selected{% endif %}>Yes</option>
                    </select>
                </div>
                <div id="trellixCmsTargetsList" class="space-y-3" data-initial="{{ settings.trellix_cms_targets | e }}"></div>
                <button type="button" id="trellixCmsAddTarget" class="px-3 py-1.5 rounded-lg text-sm font-medium bg-cyan-600 text-white transition">+ Add CMS target</button>
                <button type="submit" class="px-4 py-2 rounded-lg font-semibold bg-cyan-600 text-white transition">Save CMS settings</button>
                <button type="button" id="trellixCmsTestBtn" class="px-4 py-2 rounded-lg font-semibold bg-tertiary border border-cyan-500/40 text-cyan-200 transition">Test CMS</button>
            </form>
            <div id="trellixCmsMessage" class="hidden text-sm"></div>
            <div id="trellixCmsTestResult" class="hidden rounded-lg border border-white/10 bg-black/30 p-3 text-sm mt-3"></div>
        </div>
        <div id="trellix-exnx-sub-nx" class="trellix-exnx-subpane hidden space-y-3 pt-4 border-t border-white/10">
            <form id="trellixNxForm" class="space-y-4">
                <div class="flex items-start gap-3 rounded-lg border border-amber-500/30 bg-amber-950/20 px-3 py-3">
                    <input type="checkbox" id="automation_fireeye_ignore_ssl" name="automation_fireeye_ignore_ssl" class="mt-1 h-4 w-4 rounded border-white/20 bg-tertiary text-cyan-600"
                           {% if settings.automation_fireeye_ignore_ssl == 'true' %}checked{% endif %}>
                    <label for="automation_fireeye_ignore_ssl" class="text-sm font-semibold text-primary cursor-pointer">Allow self-signed / untrusted TLS (YARA push)</label>
                </div>
                <div>
                    <label for="automation_trellix_nx_enabled" class="block text-sm font-semibold text-secondary mb-1">Include NX in YARA automation</label>
                    <select id="automation_trellix_nx_enabled" class="w-full max-w-xs px-3 py-2 rounded-lg bg-tertiary border border-white/10 text-primary">
                        <option value="false" {% if settings.automation_trellix_nx_enabled == 'false' %}selected{% endif %}>No</option>
                        <option value="true" {% if settings.automation_trellix_nx_enabled == 'true' %}selected{% endif %}>Yes</option>
                    </select>
                </div>
                <div id="trellixNxTargetsList" class="space-y-3" data-initial="{{ settings.automation_trellix_nx_targets | e }}"></div>
                <button type="button" id="trellixNxAddTarget" class="px-3 py-1.5 rounded-lg text-sm font-medium bg-cyan-600 text-white transition">+ Add appliance</button>
                <button type="submit" class="px-4 py-2 rounded-lg font-semibold bg-cyan-600 text-white transition">Save NX settings</button>
                <button type="button" id="trellixNxTestBtn" class="px-4 py-2 rounded-lg font-semibold bg-tertiary border border-cyan-500/40 text-cyan-200 transition">Test wmps</button>
                <button type="button" id="trellixNxWsapisTestBtn" class="px-4 py-2 rounded-lg font-semibold bg-tertiary border border-white/20 text-primary transition">Test wsapis</button>
            </form>
            <div id="trellixNxMessage" class="hidden text-sm"></div>
            <div id="trellixNxTestResult" class="hidden rounded-lg border border-white/10 bg-black/30 p-3 text-sm mt-3"></div>
        </div>
    </div>
</div>
