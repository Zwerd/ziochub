<div id="settings-tab-ioc-push" class="settings-tab-pane hidden">
    <div class="bg-tertiary rounded-xl border border-white/10 p-6 max-w-3xl">
        <h3 class="text-lg font-semibold accent-blue mb-4">IOC push — HTTP POST (JSON body)</h3>
        <p class="text-secondary text-sm mb-3">After a <strong class="text-primary">new</strong> IOC is saved, the server POSTs to each <strong class="text-primary">enabled</strong> target using your <strong class="text-primary">Jinja2</strong> template (<code class="px-1 rounded bg-white/10 text-xs">ioc</code> variable).</p>
        <form id="iocPushForm" class="space-y-4">
            <div>
                <label for="ioc_push_enabled" class="block text-sm font-semibold text-secondary mb-1">Enable IOC push</label>
                <select id="ioc_push_enabled" name="ioc_push_enabled" class="w-full max-w-xs px-3 py-2 rounded-lg bg-tertiary border border-white/10 text-primary focus:border-accent-green">
                    <option value="false" {% if settings.ioc_push_enabled == 'false' %}selected{% endif %}>No</option>
                    <option value="true" {% if settings.ioc_push_enabled == 'true' %}selected{% endif %}>Yes</option>
                </select>
            </div>
            <div class="flex items-start gap-3 rounded-lg border border-amber-500/30 bg-amber-950/20 px-3 py-3">
                <input type="checkbox" id="ioc_push_ignore_ssl" name="ioc_push_ignore_ssl" class="mt-1 h-4 w-4 rounded border-white/20 bg-tertiary text-cyan-600 focus:ring-cyan-500"
                       {% if settings.ioc_push_ignore_ssl == 'true' %}checked{% endif %}>
                <div>
                    <label for="ioc_push_ignore_ssl" class="block text-sm font-semibold text-primary cursor-pointer">Allow self-signed / untrusted TLS (global default)</label>
                </div>
            </div>
            <div>
                <label class="block text-sm font-semibold text-secondary mb-2">Targets</label>
                <div id="iocPushTargetsList" class="space-y-4" data-initial="{{ settings.ioc_push_targets | e }}"></div>
                <button type="button" id="iocPushAddTarget" class="mt-2 px-3 py-1.5 rounded-lg text-sm font-medium bg-cyan-600 hover:bg-cyan-500 text-white transition">+ Add target</button>
            </div>
            <div class="flex flex-wrap gap-2 items-center">
                <button type="submit" class="px-4 py-2 rounded-lg font-semibold bg-cyan-600 hover:bg-cyan-500 text-white transition">Save IOC push settings</button>
                <button type="button" id="iocPushTestBtn" class="px-4 py-2 rounded-lg font-semibold bg-tertiary border border-cyan-500/40 hover:bg-cyan-900/30 text-cyan-200 transition">Test push</button>
            </div>
        </form>
        <div id="iocPushMessage" class="mt-4 hidden text-sm"></div>
        <div id="iocPushTestResult" class="mt-3 hidden rounded-lg border border-white/10 bg-black/30 p-3 text-sm space-y-1"></div>
    </div>
</div>
